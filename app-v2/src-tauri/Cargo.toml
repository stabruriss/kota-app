[package]
name = "kota-v2"
version = "0.1.7"
edition = "2021"
rust-version = "1.77"
default-run = "kota-v2"

[lib]
name = "kota_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
alacritty_terminal = "0.26"
shell-words = "1"

# Debug-only: exposes a W3C WebDriver server on :4444 so we can drive the
# app via `mcp__tauri-automation__*` tools (see `.claude/skills/test-app`).
# Gated by `#[cfg(debug_assertions)]` in lib.rs so release bundles stay lean.
tauri-plugin-webdriver-automation = "0.1.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "socks-proxy"] }
urlencoding = "2"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSOpenPanel",
  "NSSavePanel",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

# Milestone deps — added when their module lands so we don't block cargo
# check on version-skew issues before they're used. See `app-v2/README.md`.
#
# M4 (terminal rendering):
#   portable-pty = "0.9"
#   alacritty_terminal = "0.26"
# M5 (persistence):
# M6 (Violet log tailer):
#   notify = "6"
#   notify-debouncer-full = "0.3"

[dev-dependencies]
pretty_assertions = "1"

# Keep binary small in dev, fast in release.
[profile.dev]
opt-level = 0
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
